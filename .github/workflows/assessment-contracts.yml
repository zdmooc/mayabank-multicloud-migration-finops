name: Assessment contracts (offline)

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  validate-assessment:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Syntax check local read-only collector
        run: bash -n scripts/collect-local-inventory-readonly.sh
      - name: Verify oc adm top and kubectl top (mock only)
        run: bash tests/test_local_collector_top_dispatch.sh
      - name: Check safe local summarizer syntax
        run: python -m py_compile scripts/summarize-local-inventory.py
      - name: Run synthetic request capacity summary tests
        run: python tests/test_local_inventory_summary.py
      - name: Validate private container metrics coverage matcher with synthetic inputs
        run: python tests/test_local_top_coverage.py
      - name: Verify inventory, capacity and financial truth boundaries
        run: python scripts/validate_assessment.py
