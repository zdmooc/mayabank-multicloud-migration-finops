name: Assessment contracts (offline)

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  validate-assessment:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Syntax check local read-only collector
        run: bash -n scripts/collect-local-inventory-readonly.sh
      - name: Verify oc adm top and kubectl top (mock only)
        run: bash tests/test_local_collector_top_dispatch.sh
      - name: Check safe local summarizer syntax
        run: python -m py_compile scripts/summarize-local-inventory.py
      - name: Run synthetic request capacity summary tests
        run: python tests/test_local_inventory_summary.py
      - name: Validate private container metrics coverage matcher with synthetic inputs
        run: python tests/test_local_top_coverage.py
      - name: Static compile for PostgreSQL read-only audit
        run: python -m py_compile scripts/audit-crc-postgresql-readonly.py
      - name: Offline synthetic PostgreSQL topology and redaction tests
        run: python tests/test_postgresql_readonly_audit.py
      - name: Syntax check generic OpenShift CRC project auditor
        run: python -m py_compile scripts/audit-openshift-project-readonly.py
      - name: Verify generic project audit with synthetic Kubernetes metadata
        run: python tests/test_openshift_project_audit.py
      - name: Check standalone CRC HTML renderer syntax
        run: python -m py_compile scripts/render_openshift_project_html.py
      - name: Run synthetic HTML Wero architecture and sanitization tests
        run: python tests/test_openshift_html_report.py
      - name: Verify inventory, capacity and financial truth boundaries
        run: python scripts/validate_assessment.py
